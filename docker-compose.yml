# SoulsGuide 生产部署（D24：Docker Compose 三容器方案，阶段八）
# 服务：mysql（数据+自动初始化）+ server（Node 18 + FFmpeg）+ nginx（前端+反代+uploads 直出）
# 2G 内存降配版（阿里云 2核2G 试用机实测方案）：
#   - MySQL 关 performance_schema + 128M 缓冲池（省 ~300MB）
#   - 每容器 mem_limit 上限，防止 FFmpeg 转码峰值 OOM 连坐杀 MySQL
# 使用：同目录 .env 提供 MYSQL_ROOT_PASSWORD / JWT_SECRET（值沿用 server/.env，见部署指南）
#   - mysql 端口不映射宿主机（仅内部网络访问），对外只有 nginx:80

services:
  mysql:
    image: mysql:8
    container_name: sg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: souls_guide
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --table-open-cache=400
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
      # 首启自动初始化：schema（13 表）+ seed（admin + 7 游戏），幂等可重复执行
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 900m

  server:
    build: ./server
    container_name: sg-server
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: souls_guide
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      TZ: Asia/Shanghai
    volumes:
      - server-uploads:/app/uploads
      - server-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 600m

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: sg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # uploads 直出（10.4：nginx Range 支持视频拖动播放），与 server 容器同卷
      - server-uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - server
    mem_limit: 128m

volumes:
  mysql-data:
  server-uploads:
  server-logs:
