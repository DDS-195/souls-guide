# SoulsGuide 基础/本地部署（生产环境须叠加 docker-compose.prod.yml 启用 HTTPS）
# 服务：mysql（持久化数据）+ server（Node 24 + FFmpeg）+ nginx（前端+反代，媒体先鉴权）
# 2G 内存降配版（阿里云 2核2G 试用机实测方案）：
#   - MySQL 关 performance_schema + 128M 缓冲池（省 ~300MB）
#   - 每容器 mem_limit 上限，防止 FFmpeg 转码峰值 OOM 连坐杀 MySQL
# 使用：同目录 .env 提供 MYSQL_ROOT_PASSWORD / JWT_SECRET（值沿用 server/.env，见部署指南）
#   - mysql 端口不映射宿主机（仅内部网络访问），对外只有 nginx:80

services:
  mysql:
    image: mysql:8
    container_name: sg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: souls_guide
      MYSQL_USER: ${MYSQL_USER:-souls_guide_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置应用数据库密码 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --table-open-cache=400
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
      # 首启自动初始化：17 表 + 7 个预设游戏；管理员由服务启动引导创建。
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: ./server
    container_name: sg-server
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-souls_guide_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置应用数据库密码 MYSQL_PASSWORD}
      DB_NAME: souls_guide
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY_HOPS: 1
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      TZ: Asia/Shanghai
    volumes:
      - server-uploads:/app/uploads
      - server-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 600m

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: sg-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # uploads 直出（10.4：nginx Range 支持视频拖动播放），与 server 容器同卷
      - server-uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - server
    mem_limit: 128m

volumes:
  mysql-data:
  server-uploads:
  server-logs:
