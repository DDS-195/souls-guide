worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  upstream sg_server { server server:3000; }
  server {
    listen 80;
    server_name ${SITE_HOST};
    if ($host != "${SITE_HOST}") { return 444; }
    include /etc/nginx/security-headers.conf;
    location /health/ { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(?:server|ops|docs)(?:/|$)|^/(?:docker-compose[^/]*|package(?:-lock)?\.json)$ { return 404; }
    location ~ ^/uploads/videos/tmp/ { return 404; }
    location /api/ {
      proxy_pass http://sg_server;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_connect_timeout 5s;
      proxy_read_timeout 1200s;
      proxy_send_timeout 1200s;
      client_max_body_size 20m;
    }
    location /uploads/ {
      include /etc/nginx/security-headers.conf;
      proxy_pass http://sg_server;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
    }
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      alias /usr/share/nginx/html/assets/;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }
    location / {
      include /etc/nginx/security-headers.conf;
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
