# SoulsGuide 生产 Nginx 配置（D24，阶段八）
# 职责（设计文档 10.4 / 10.6 / 10.7）：
#   1. serve 前端 dist（SPA history 路由回退 index.html）
#   2. 反代 /api → server:3000（merge 转码长耗时，超时放大）
#   3. 直出 /uploads（nginx 原生 Range，<video> 拖动播放依赖）

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml image/webp;

  upstream sg_server {
    server server:3000;
  }

  server {
    listen 80;
    server_name _;
    location ~ /\. { return 404; }
    location ~* ^/(?:server|ops|docs)(?:/|$)|^/(?:docker-compose[^/]*|package(?:-lock)?\.json)$ { return 404; }
    location /health/ { return 404; }

    # API 反向代理
    # proxy_read_timeout：视频 merge 可能触发 FFmpeg 转码（后端兜底 15 分钟），
    # nginx 默认 60s 会 504，必须放大到 20 分钟（对齐前端 axios 超时约定）
    location /api/ {
      proxy_pass http://sg_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 1200s;
      proxy_send_timeout 1200s;
      # 视频分片 5MB+64KB 余量，给足余量
      client_max_body_size 20m;
    }

    # 后端逐次校验媒体可见性，express.static 保留 Range 支持。
    location /uploads/ {
      proxy_pass http://sg_server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 构建产物带 hash，长缓存 immutable（10.6）
    location /assets/ {
      alias /usr/share/nginx/html/assets/;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    # SPA 入口：vue-router history 模式回退 + index.html 不缓存（发版立即生效）
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
