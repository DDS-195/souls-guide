worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml image/webp;

  upstream sg_server {
    server server:3000;
  }

  server {
    listen 80;
    server_name ${SITE_HOST};
    if ($host != "${SITE_HOST}") { return 444; }
    return 301 https://${SITE_HOST}$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name ${SITE_HOST};
    if ($host != "${SITE_HOST}") { return 444; }

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/security-headers.conf;

    location /health/ { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/(?:server|ops|docs)(?:/|$)|^/(?:docker-compose[^/]*|package(?:-lock)?\.json)$ { return 404; }
    location ~ ^/uploads/videos/tmp/ { return 404; }

    location /api/ {
      proxy_pass http://sg_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_connect_timeout 5s;
      proxy_read_timeout 1200s;
      proxy_send_timeout 1200s;
      client_max_body_size 20m;
    }

    location /uploads/ {
      include /etc/nginx/security-headers.conf;
      proxy_pass http://sg_server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      alias /usr/share/nginx/html/assets/;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      include /etc/nginx/security-headers.conf;
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
